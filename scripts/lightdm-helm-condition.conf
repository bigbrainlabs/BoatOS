# Drop-in: /etc/systemd/system/lightdm.service.d/helm-condition.conf
# Helm (flutter-pi) darf nur starten, wenn boatos-detect-display.sh einen
# Touchscreen erkannt und /run/boatos/has-display angelegt hat. Ohne Touchscreen
# (headless oder reiner HDMI-Monitor) startet lightdm — und damit Helm — nicht.
[Unit]
ConditionPathExists=/run/boatos/has-display
